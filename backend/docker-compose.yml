services:
  db:
    image: mysql:latest
    container_name: fittech_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ibrahim12345
      MYSQL_DATABASE: fittech_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data: