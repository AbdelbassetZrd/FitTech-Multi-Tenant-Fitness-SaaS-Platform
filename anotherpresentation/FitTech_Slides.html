<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>FitTech System Architecture – Codex Deck</title>

  <style>
    :root {
      --bg: #05060F;
      --panel: #080924;
      --panel-alt: #0E1235;
      --accent: #4CD1FF;
      --accent-strong: #29E7AE;
      --accent-warm: #FF8E5E;
      --text: #F5F8FF;
      --muted: #A8B4D4;
      --grid: rgba(76, 209, 255, 0.08);
      --border: rgba(76, 209, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(76, 209, 255, 0.18), transparent 48%),
        radial-gradient(circle at 80% 10%, rgba(41, 231, 174, 0.18), transparent 48%),
        radial-gradient(circle at 50% 110%, rgba(255, 142, 94, 0.15), transparent 55%);
      pointer-events: none;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(0deg, var(--grid) 1px, transparent 1px);
      background-size: 110px 110px;
      opacity: 0.3;
      pointer-events: none;
      z-index: -1;
    }

    .progress { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: rgba(255,255,255,0.08); z-index: 200; backdrop-filter: blur(14px); }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width 280ms ease; }

    .counter { position: fixed; bottom: 2.5rem; left: 2.5rem; font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); z-index: 150; }

    .controls { position: fixed; bottom: 2rem; right: 2rem; display: flex; gap: 0.75rem; z-index: 150; }
    .btn { padding: 0.85rem 1.6rem; border-radius: 12px; border: 1px solid var(--border); background: rgba(8, 9, 36, 0.85); color: var(--text); font-weight: 600; letter-spacing: 0.05em; cursor: pointer; transition: all 0.25s ease; }
    .btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 12px 30px rgba(76, 209, 255, 0.18); }

    .deck { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    .slide { position: absolute; inset: 0; padding: 4.5rem 6vw 4rem; opacity: 0; transform: translateX(70px) scale(0.97); transition: opacity 520ms ease, transform 520ms ease; pointer-events: none; display: flex; align-items: center; justify-content: center; }
    .slide.active { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; }
    .slide.prev { transform: translateX(-70px) scale(0.97); }

    .slide-inner { width: min(1180px, 100%); min-height: calc(100vh - 9rem); display: flex; flex-direction: column; justify-content: center; gap: 1.4rem; background: rgba(8, 10, 38, 0.78); border: 1px solid var(--border); border-radius: 28px; padding: 3rem 3.6rem; box-shadow: 0 40px 90px rgba(3, 8, 43, 0.45); backdrop-filter: blur(24px); }
    .slide.section .slide-inner { background: linear-gradient(130deg, rgba(76, 209, 255, 0.2), rgba(41, 231, 174, 0.16)); border-color: rgba(76, 209, 255, 0.4); }
    .slide.cover .slide-inner { background: transparent; border: none; box-shadow: none; padding: 2rem 0; align-items: center; text-align: center; }

    .kicker { font-family: 'Space Grotesk', sans-serif; font-size: 0.92rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent-strong); }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(3rem, 6vw, 5.6rem); font-weight: 700; letter-spacing: -0.02em; }
    h2 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
    h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 600; color: var(--accent); }
    p { font-size: 1.15rem; color: var(--muted); line-height: 1.74; max-width: 960px; }

    ul { list-style: none; display: grid; gap: 0.8rem; }
    li { font-size: 1.08rem; color: var(--text); padding-left: 1.4rem; position: relative; line-height: 1.6; }
    li::before { content: ""; position: absolute; left: 0; top: 0.65rem; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(76,209,255,0.6); }

    .badge-group { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-top: 1.4rem; }
    .badge { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.45rem 1.1rem; border-radius: 999px; border: 1px solid rgba(76, 209, 255, 0.45); color: var(--accent); background: rgba(76, 209, 255, 0.12); }
    .badge.alt { border-color: rgba(41, 231, 174, 0.4); color: var(--accent-strong); background: rgba(41, 231, 174, 0.12); }

    .grid { display: grid; gap: 1.2rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card { background: rgba(8, 9, 36, 0.85); border: 1px solid rgba(76, 209, 255, 0.18); border-radius: 20px; padding: 1.6rem 1.8rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .card h4 { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; color: var(--accent); letter-spacing: 0.02em; }
    .card p { font-size: 0.98rem; line-height: 1.6; color: var(--muted); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; }
    .stat { background: rgba(12, 15, 42, 0.8); border: 1px solid rgba(41, 231, 174, 0.2); border-radius: 18px; padding: 1.4rem 1.8rem; }
    .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 2.4rem; color: var(--accent-strong); letter-spacing: -0.02em; }
    .stat-label { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.18em; color: rgba(245, 248, 255, 0.75); margin-top: 0.3rem; }
    .stat-detail { font-size: 0.9rem; color: var(--muted); margin-top: 0.6rem; }

    .timeline { position: relative; padding-left: 2.2rem; display: grid; gap: 1.1rem; }
    .timeline::before { content: ""; position: absolute; left: 0.7rem; top: 0.2rem; bottom: 0.2rem; width: 2px; background: linear-gradient(180deg, var(--accent), rgba(41, 231, 174, 0.7)); }
    .timeline-item { position: relative; padding: 1rem 1.2rem; background: rgba(9, 10, 32, 0.85); border: 1px solid rgba(76, 209, 255, 0.16); border-radius: 16px; font-size: 1.05rem; line-height: 1.6; }
    .timeline-item::before { content: ""; position: absolute; left: -1.52rem; top: 1.1rem; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px rgba(76, 209, 255, 0.8); }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 1rem 1.2rem; border-bottom: 1px solid rgba(76, 209, 255, 0.18); font-size: 1rem; text-align: left; }
    th { font-family: 'Space Grotesk', sans-serif; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.9rem; }

    pre { background: rgba(6, 8, 26, 0.9); border: 1px solid rgba(76, 209, 255, 0.18); border-radius: 16px; padding: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.7; color: var(--accent); margin-top: 1rem; overflow-x: auto; max-height: 360px; }
    .code-note { font-size: 0.9rem; color: var(--muted); margin-top: 0.6rem; }

    @media (max-width: 900px) {
      .slide { padding: 3rem 1.5rem; }
      .slide-inner { padding: 2.4rem; border-radius: 22px; }
      h1 { font-size: clamp(2.4rem, 8vw, 4rem); }
      h2 { font-size: clamp(2rem, 6vw, 3rem); }
      .grid { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr !important; }
    }
  </style>
</head>

      inner.className = 'slide-inner';

      if (data.type === 'cover') {
        inner.innerHTML = `
          <div class="kicker">${data.kicker || ''}</div>
          <h1>${data.title || ''}</h1>
          <p>${data.subtitle || ''}</p>
          ${data.badges ? `<div class="badge-group">${data.badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>` : ''}
        `;
      } else if (data.type === 'section') {
        inner.innerHTML = `
          <div class="kicker">${data.kicker || ''}</div>
          <h2>${data.title || ''}</h2>
          ${data.subtitle ? `<p>${data.subtitle}</p>` : ''}
        `;
      } else {
        let content = '';
        if (data.kicker) content += `<div class="kicker">${data.kicker}</div>`;
        if (data.title) content += `<h2>${data.title}</h2>`;
        if (data.subtitle) content += `<p>${data.subtitle}</p>`;

        if (data.bullets) {
          content += `<ul>${data.bullets.map(item => `<li>${item}</li>`).join('')}</ul>`;
        }
        if (data.cards) {
          content += `<div class="grid">${data.cards.map(card => `
            <div class="card">
              <h4>${card.title}</h4>
              <p>${card.description}</p>
            </div>
          `).join('')}</div>`;
        }
        if (data.stats) {
          content += `<div class="stats">${data.stats.map(stat => `
            <div class="stat">
              <div class="stat-value">${stat.value}</div>
              <div class="stat-label">${stat.label}</div>
              ${stat.detail ? `<div class="stat-detail">${stat.detail}</div>` : ''}
            </div>
          `).join('')}</div>`;
        }
        if (data.timeline || data.items) {
          const items = data.timeline || data.items;
          content += `<div class="timeline">${items.map(item => `<div class="timeline-item">${item}</div>`).join('')}</div>`;
        }
        if (data.headers && data.rows) {
          content += `<table>
            <thead><tr>${data.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
            <tbody>${data.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>`;
        }
        if (data.code) {
          content += `<pre><code>${data.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
          if (data.note) content += `<div class="code-note">${data.note}</div>`;
        }

        inner.innerHTML = content;
      }

      slide.appendChild(inner);
      return slide;
    }

    slidesData.forEach((slideData, index) => {
      const slideEl = renderSlide(slideData);
      if (index === 0) slideEl.classList.add('active');
      deckEl.appendChild(slideEl);
    });

    const slides = Array.from(document.querySelectorAll('.slide'));
    const progressBar = document.getElementById('progressBar');
    const counter = document.getElementById('counter');
    const totalSlides = slides.length;
    let currentIndex = 0;

    function updateSlides() {
      slides.forEach((slide, index) => {
        slide.classList.toggle('active', index === currentIndex);
        slide.classList.toggle('prev', index < currentIndex);
      });
      const progress = ((currentIndex + 1) / totalSlides) * 100;
      progressBar.style.width = `${progress}%`;
      counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
    }

    function nextSlide() {
      if (currentIndex < totalSlides - 1) {
        currentIndex++;
        updateSlides();
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        updateSlides();
      }
    }

    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === ' ') {
        nextSlide();
      } else if (event.key === 'ArrowLeft') {
        prevSlide();
      }
    });
  </script>
</body>
</html>
