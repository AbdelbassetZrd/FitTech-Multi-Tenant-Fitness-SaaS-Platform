<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTech Final-Year Project Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0F1E;
      --panel: #101A2F;
      --card: #1E3A5F;
      --card-2: #142642;
      --accent: #00D4FF;
      --green: #39FF14;
      --red: #FF4757;
      --amber: #FFD166;
      --text: #F5F9FF;
      --muted: #A8B8D5;
      --line: rgba(0, 212, 255, 0.22);
      --soft: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(0,212,255,0.035) 1px, transparent 1px),
        linear-gradient(rgba(0,212,255,0.035) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(0,212,255,0.08), transparent 34rem),
        var(--bg);
      background-size: 4rem 4rem, 4rem 4rem, auto, auto;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, transparent 0 58%, rgba(57,255,20,0.05) 58.1% 58.3%, transparent 58.4%),
        linear-gradient(25deg, transparent 0 68%, rgba(0,212,255,0.05) 68.1% 68.3%, transparent 68.4%);
      opacity: 0.85;
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .top-progress {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      height: 5px;
      z-index: 50;
      background: rgba(255,255,255,0.08);
    }

    .top-progress span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      box-shadow: 0 0 24px rgba(57,255,20,0.45);
      transition: width 450ms ease;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 4.5rem 5vw 4rem;
      opacity: 0;
      transform: translateX(3.5rem) scale(0.985);
      transition: opacity 520ms ease, transform 520ms ease;
      pointer-events: none;
      overflow: auto;
    }

    .slide.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .slide.prev {
      transform: translateX(-3.5rem) scale(0.985);
    }

    .slide-inner {
      width: min(1180px, 100%);
      min-height: calc(100vh - 8.5rem);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.25rem;
    }

    .section-slide .slide-inner {
      align-items: flex-start;
      justify-content: center;
    }

    .section-slide {
      background:
        linear-gradient(120deg, rgba(0,212,255,0.18), rgba(57,255,20,0.11) 48%, rgba(255,71,87,0.10)),
        linear-gradient(90deg, rgba(10,15,30,0.92), rgba(10,15,30,0.78));
    }

    .kicker {
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      margin: 0;
      font-family: Poppins, Inter, sans-serif;
      letter-spacing: 0;
      line-height: 1.04;
    }

    h1 {
      font-size: 4.8rem;
      font-weight: 900;
    }

    h2 {
      font-size: 3.15rem;
      font-weight: 850;
      max-width: 1050px;
    }

    h3 {
      font-size: 1.25rem;
      font-weight: 800;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.62;
      max-width: 920px;
    }

    .lead {
      font-size: 1.28rem;
      color: #DCEBFF;
      max-width: 980px;
    }

    .muted { color: var(--muted); }
    .accent { color: var(--accent); }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .amber { color: var(--amber); }

    .layout-2 {
      display: grid;
      grid-template-columns: 1.03fr 0.97fr;
      gap: 1rem;
      align-items: stretch;
    }

    .layout-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .layout-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.85rem;
    }

    .card, .metric, .mini-card {
      border: 1px solid rgba(0,212,255,0.18);
      background:
        linear-gradient(180deg, rgba(30,58,95,0.82), rgba(16,26,47,0.88));
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.24);
    }

    .card {
      padding: 1rem;
      min-height: 8.6rem;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0.8;
    }

    .card p, .mini-card p { font-size: 0.9rem; line-height: 1.48; }
    .mini-card { padding: 0.85rem; min-height: 6.8rem; }

    .icon {
      width: 2.4rem;
      height: 2.4rem;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(57,255,20,0.34);
      background: rgba(57,255,20,0.08);
      color: var(--green);
      border-radius: 8px;
      font-weight: 900;
      margin-bottom: 0.8rem;
      font-size: 0.82rem;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 2rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(0,212,255,0.26);
      background: rgba(0,212,255,0.07);
      color: #D9F8FF;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .callout {
      border-left: 4px solid var(--green);
      background: rgba(57,255,20,0.07);
      padding: 1rem 1.15rem;
      border-radius: 8px;
      color: #EFFFF0;
      font-size: 1.05rem;
      font-weight: 750;
      line-height: 1.45;
    }

    .callout.red {
      border-color: var(--red);
      background: rgba(255,71,87,0.09);
      color: #FFECEE;
    }

    .callout.blue {
      border-color: var(--accent);
      background: rgba(0,212,255,0.08);
      color: #E7FBFF;
    }

    .dev-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      width: fit-content;
      min-height: 2rem;
      padding: 0.38rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255,209,102,0.42);
      background: rgba(255,209,102,0.1);
      color: #FFF1B8;
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cinematic {
      display: grid;
      place-items: center;
      min-height: 26rem;
      text-align: center;
      border-radius: 8px;
      border: 1px solid rgba(0,212,255,0.18);
      background:
        linear-gradient(120deg, rgba(0,212,255,0.12), rgba(57,255,20,0.07)),
        rgba(12,20,38,0.72);
      padding: 2.2rem;
    }

    .cinematic .quote {
      max-width: 1000px;
      color: #FFFFFF;
      font-family: Poppins, Inter, sans-serif;
      font-size: 2.25rem;
      font-weight: 850;
      line-height: 1.2;
    }

    .problem-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .pain {
      display: grid;
      grid-template-columns: 2.55rem 1fr;
      gap: 0.75rem;
      align-items: start;
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid rgba(0,212,255,0.17);
      background: rgba(16,26,47,0.84);
    }

    .pain-num {
      display: grid;
      place-items: center;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 8px;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.32);
      color: var(--accent);
      font-weight: 900;
    }

    .pain h3 {
      margin-bottom: 0.2rem;
      color: #FFFFFF;
      font-size: 1rem;
    }

    .pain p {
      font-size: 0.84rem;
      line-height: 1.42;
    }

    .slide.dense-slide {
      padding-top: 2.7rem;
      padding-bottom: 3rem;
    }

    .slide.dense-slide .slide-inner {
      gap: 0.65rem;
    }

    .slide.dense-slide h2 {
      font-size: 2.75rem;
    }

    .slide.dense-slide .lead {
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .slide.dense-slide .code {
      padding: 0.62rem 0.75rem;
      font-size: 0.7rem;
      line-height: 1.35;
    }

    .slide.dense-slide .diagram {
      min-height: 11rem;
      padding: 0.75rem;
    }

    .slide.dense-slide .flow {
      min-height: 7.6rem;
      gap: 0.55rem;
    }

    .slide.dense-slide .node {
      min-width: 7.8rem;
      padding: 0.65rem;
      font-size: 0.88rem;
    }

    .slide.dense-slide .node small {
      font-size: 0.64rem;
      line-height: 1.25;
    }

    .slide.dense-slide .mini-card {
      min-height: 5.2rem;
      padding: 0.65rem 0.72rem;
    }

    .slide.dense-slide .mini-card h3 {
      font-size: 0.95rem;
      margin-bottom: 0.18rem;
    }

    .slide.dense-slide .mini-card p {
      font-size: 0.76rem;
      line-height: 1.32;
    }

    .slide.dense-slide .bars {
      padding: 0.7rem 0.85rem;
      gap: 0.46rem;
    }

    .slide.dense-slide .bar-row {
      font-size: 0.8rem;
    }

    .slide.dense-slide th,
    .slide.dense-slide td {
      padding: 0.42rem 0.55rem;
      font-size: 0.78rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid rgba(0,212,255,0.18);
      background: rgba(12,20,38,0.78);
    }

    th, td {
      text-align: left;
      padding: 0.7rem 0.78rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      color: #E9F2FF;
      font-size: 0.88rem;
      vertical-align: top;
    }

    th {
      color: var(--accent);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(0,212,255,0.07);
    }

    tr:last-child td { border-bottom: 0; }

    .table-tight th, .table-tight td { padding: 0.55rem 0.65rem; font-size: 0.82rem; }

    .bars {
      display: grid;
      gap: 0.72rem;
      padding: 1rem;
      border-radius: 8px;
      background: rgba(12,20,38,0.76);
      border: 1px solid rgba(0,212,255,0.18);
    }

    .bar-row {
      display: grid;
      grid-template-columns: 13rem 1fr 4.2rem;
      gap: 0.8rem;
      align-items: center;
      color: #DCEBFF;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .bar-track {
      height: 0.9rem;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .bar-fill {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 99px;
      box-shadow: 0 0 18px rgba(57,255,20,0.3);
      transition: width 900ms cubic-bezier(.2,.8,.2,1);
    }

    .bar-fill.red { background: linear-gradient(90deg, var(--red), #FF8A96); box-shadow: 0 0 18px rgba(255,71,87,0.28); }
    .bar-fill.amber { background: linear-gradient(90deg, var(--amber), #FFEF9E); box-shadow: 0 0 18px rgba(255,209,102,0.25); }
    .slide.active .bar-fill { width: var(--w); }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .metric {
      padding: 0.95rem;
    }

    .metric strong {
      display: block;
      color: #FFFFFF;
      font-family: Poppins, Inter, sans-serif;
      font-size: 1.9rem;
      line-height: 1;
      margin-bottom: 0.35rem;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .diagram {
      min-height: 18rem;
      border-radius: 8px;
      border: 1px solid rgba(0,212,255,0.18);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        rgba(12,20,38,0.75);
      background-size: 2rem 2rem;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    .diagram svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .diagram pre {
      margin: 0;
      background: transparent;
      color: inherit;
      font-size: 0.9rem;
      white-space: pre;
    }

    .flow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      height: 100%;
      min-height: 12rem;
    }

    .node {
      min-width: 8.8rem;
      max-width: 13rem;
      padding: 0.85rem;
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 8px;
      background: rgba(30,58,95,0.75);
      text-align: center;
      font-weight: 800;
      color: #F3FBFF;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset;
    }

    .node small {
      display: block;
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.35;
      font-weight: 600;
    }

    .arrow {
      color: var(--accent);
      font-size: 1.65rem;
      font-weight: 900;
    }

    .stack-pyramid {
      display: grid;
      gap: 0.55rem;
      justify-items: center;
      padding: 0.6rem 0;
    }

    .pyr {
      height: 2.5rem;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #06111B;
      background: linear-gradient(90deg, var(--accent), var(--green));
      box-shadow: 0 12px 30px rgba(0,212,255,0.14);
    }

    .pyr:nth-child(1) { width: 52%; }
    .pyr:nth-child(2) { width: 64%; }
    .pyr:nth-child(3) { width: 76%; }
    .pyr:nth-child(4) { width: 88%; }
    .pyr:nth-child(5) { width: 100%; }

    .code {
      white-space: pre-wrap;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.83rem;
      line-height: 1.55;
      color: #DFFBFF;
      background: #07101F;
      border: 1px solid rgba(0,212,255,0.18);
      border-radius: 8px;
      padding: 1rem;
    }

    .cover-grid {
      display: grid;
      grid-template-columns: 1fr 22rem;
      gap: 3rem;
      align-items: center;
    }

    .logo-mark {
      position: relative;
      width: 20rem;
      height: 20rem;
      border: 1px solid rgba(0,212,255,0.24);
      border-radius: 8px;
      background: rgba(16,26,47,0.72);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .logo-mark::before {
      content: "";
      position: absolute;
      inset: 1.3rem;
      border: 1px dashed rgba(57,255,20,0.28);
      border-radius: 8px;
      animation: pulseBorder 2.6s infinite ease-in-out;
    }

    .dumbbell {
      position: relative;
      width: 13rem;
      height: 5rem;
    }

    .dumbbell span {
      position: absolute;
      top: 2.1rem;
      height: 0.8rem;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--green));
      box-shadow: 0 0 26px rgba(57,255,20,0.48);
    }

    .dumbbell .bar { left: 2rem; right: 2rem; }
    .dumbbell .p1, .dumbbell .p2, .dumbbell .p3, .dumbbell .p4 {
      top: 0.8rem;
      width: 0.92rem;
      height: 3.6rem;
      border-radius: 0.35rem;
      background: #EAF7FF;
      box-shadow: none;
    }
    .dumbbell .p1 { left: 0.8rem; }
    .dumbbell .p2 { left: 1.8rem; }
    .dumbbell .p3 { right: 1.8rem; }
    .dumbbell .p4 { right: 0.8rem; }

    .circuit-dot {
      position: absolute;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px rgba(57,255,20,0.65);
      animation: blink 1.8s infinite ease-in-out;
    }
    .c1 { left: 4rem; top: 4.5rem; }
    .c2 { right: 4.4rem; top: 5.7rem; animation-delay: .35s; }
    .c3 { left: 6.5rem; bottom: 4.4rem; animation-delay: .7s; }
    .c4 { right: 6rem; bottom: 5.1rem; animation-delay: 1s; }

    .big-section-number {
      color: rgba(0,212,255,0.18);
      font-family: Poppins, Inter, sans-serif;
      font-size: 9rem;
      font-weight: 900;
      line-height: 0.8;
    }

    .line-chart {
      border: 1px solid rgba(0,212,255,0.18);
      border-radius: 8px;
      background: rgba(12,20,38,0.76);
      min-height: 17rem;
      padding: 0.9rem;
    }

    .line-chart svg {
      width: 100%;
      height: 14rem;
      overflow: visible;
    }

    .line-chart.compact-chart {
      min-height: 8.6rem;
      padding: 0.6rem 0.8rem;
    }

    .line-chart.compact-chart svg {
      height: 6.4rem;
    }

    .line-chart path.series {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
    }

    .slide.active .line-chart path.series {
      animation: drawLine 1.4s ease forwards;
    }

    .line-chart .axis {
      stroke: rgba(255,255,255,0.16);
      stroke-width: 1;
    }

    .legend {
      display: flex;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .dot {
      display: inline-block;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      margin-right: 0.35rem;
      background: var(--accent);
    }

    .dot.green { background: var(--green); }
    .dot.red { background: var(--red); }
    .dot.amber { background: var(--amber); }

    .nav {
      position: fixed;
      right: 1.2rem;
      bottom: 1.05rem;
      display: flex;
      gap: 0.6rem;
      z-index: 60;
    }

    .nav button {
      width: 3rem;
      height: 3rem;
      border-radius: 8px;
      border: 1px solid rgba(0,212,255,0.28);
      color: #FFFFFF;
      background: rgba(16,26,47,0.92);
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0,0,0,0.24);
    }

    .nav button:hover {
      border-color: var(--green);
      color: var(--green);
    }

    .counter {
      position: fixed;
      left: 1.2rem;
      bottom: 1.35rem;
      z-index: 60;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.86rem;
      background: rgba(16,26,47,0.8);
      border: 1px solid rgba(0,212,255,0.16);
      border-radius: 999px;
      padding: 0.5rem 0.8rem;
    }

    .footnote {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.45;
    }

    .small-list {
      display: grid;
      gap: 0.45rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .small-list li {
      border-left: 2px solid rgba(0,212,255,0.55);
      background: rgba(0,212,255,0.045);
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      color: #DCEBFF;
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .micro-compare {
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      gap: 0.95rem;
      align-items: stretch;
    }

    .micro-visual {
      min-height: 14rem;
      display: grid;
      gap: 0.7rem;
      align-content: center;
    }

    .micro-stack {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.45rem;
    }

    .micro-box, .event-pill {
      border: 1px solid rgba(0,212,255,0.28);
      background: rgba(20,38,66,0.82);

    const deck = document.getElementById("deck");
    const counter = document.getElementById("counter");
    const progressFill = document.getElementById("progressFill");
    const initialHash = window.location.hash.match(/slide-(\d+)/);
    let current = initialHash ? Math.max(0, Math.min(slides.length - 1, Number(initialHash[1]) - 1)) : 0;

    function renderSlides() {
      deck.innerHTML = slides.map((slide, i) => `
        <section class="slide ${slide.cls || ""}" data-index="${i}" aria-label="Slide ${i + 1}">
          <div class="slide-inner">
            ${slide.kicker && !slide.html.includes('class="kicker"') ? `<div class="kicker">${slide.kicker}</div>` : ""}
            ${slide.title && !slide.html.includes("<h1") && !slide.html.includes("<h2") ? `<h2>${slide.title}</h2>` : ""}
            ${slide.html}
          </div>
        </section>
      `).join("");
      update();
    }

    function update() {
      const sections = Array.from(document.querySelectorAll(".slide"));
      sections.forEach((section, i) => {
        section.classList.toggle("active", i === current);
        section.classList.toggle("prev", i < current);
      });
      counter.textContent = `Slide ${current + 1} / ${slides.length}`;
      progressFill.style.width = `${((current + 1) / slides.length) * 100}%`;
      window.location.hash = `slide-${current + 1}`;
    }

    function go(delta) {
      const next = Math.max(0, Math.min(slides.length - 1, current + delta));
      if (next !== current) {
        current = next;
        update();
      }
    }

    function goTo(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      update();
    }

    document.getElementById("prevBtn").addEventListener("click", () => go(-1));
    document.getElementById("nextBtn").addEventListener("click", () => go(1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") go(1);
      if (event.key === "ArrowLeft" || event.key === "PageUp") go(-1);
      if (event.key === "Home") goTo(0);
      if (event.key === "End") goTo(slides.length - 1);
    });

    window.addEventListener("hashchange", () => {
      const match = window.location.hash.match(/slide-(\d+)/);
      if (match) goTo(Number(match[1]) - 1);
    });

    renderSlides();
  </script>
